<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded dark background -->
  <rect width="100" height="100" rx="22" fill="#0f172a" />

  <!-- Simple hanger shape -->
  <g filter="url(#shadow)" stroke="#e2e8f0" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hook -->
    <path d="M 50 18 L 50 28 C 50 40 58 44 58 36" />
    <!-- Shoulders -->
    <path d="M 24 54 C 36 44 64 44 76 54" />
    <!-- Bottom bar -->
    <line x1="24" y1="54" x2="76" y2="54" />
  </g>

  <!-- Connecting thread -->
  <line x1="50" y1="36" x2="50" y2="48" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />

  <!-- Tag with accent color -->
  <g filter="url(#shadow)">
    <rect x="32" y="48" width="36" height="36" rx="6" fill="#2563eb" />
    <rect x="36" y="52" width="28" height="28" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="2.5 2.5" opacity="0.8" />
    <text x="50" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">M</text>
  </g>
</svg>